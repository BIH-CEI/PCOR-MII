name: Build IG and Deploy

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll

      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
          restore-keys: fhir-packages-

      - name: Cache IG Publisher JAR
        uses: actions/cache@v4
        with:
          path: input-cache/publisher.jar
          key: ig-publisher-latest

      - name: Update IG Publisher (download if cache miss)
        run: |
          chmod +x _updatePublisher.sh
          ./_updatePublisher.sh -y

      # MII-weiter Paket-Cache (Muster: kerndatensatzmodul-intensivmedizin, mii-testdata):
      # der cache-store-Branch des fhir-package-store traegt u. a. de.gematik.isik 6.0.0
      # MIT nachgebauten Snapshots (das Registry-Paket hat keine), hl7.fhir.uv.sdc 4.0.0
      # und die Terminologie-Pakete. Nur fehlende Pakete werden uebernommen (cp -n).
      - name: FHIR-Paket-Cache aus dem fhir-package-store laden
        uses: actions/checkout@v4
        with:
          repository: medizininformatik-initiative/fhir-package-store
          ref: cache-store
          path: .fhir-package-store
          persist-credentials: false

      - name: Paket-Cache nach ~/.fhir uebernehmen
        run: |
          mkdir -p ~/.fhir/packages
          cp -rn .fhir-package-store/packages/* ~/.fhir/packages/ || true
          rm -rf .fhir-package-store

      # Das MII-PRO-Modul wird formal unter seinem GitHub-Pages-Canonical publiziert
      # (package.tgz), bevor es im Simplifier-Register liegt. Solange die gepinnte
      # Version dort fehlt, holt dieser Schritt sie aus der Publikation; liegt sie
      # schon im Cache (Registry oder actions/cache), passiert nichts.
      - name: MII-PRO-Modul aus der formalen Publikation installieren, falls nicht im Cache
        run: |
          PKG=de.medizininformatikinitiative.kerndatensatz.pros
          VER=$(grep -E "^  $PKG:" sushi-config.yaml | awk '{print $2}')
          DIR="$HOME/.fhir/packages/$PKG#$VER"
          if [ -d "$DIR/package" ]; then echo "im Cache: $PKG#$VER"; exit 0; fi
          curl -fsSL "https://medizininformatik-initiative.github.io/kerndatensatzmodul-proms/package.tgz" -o /tmp/pros.tgz
          mkdir -p /tmp/pros && tar -xzf /tmp/pros.tgz -C /tmp/pros
          GOT=$(python3 -c "import json;print(json.load(open('/tmp/pros/package/package.json'))['version'])")
          if [ "$GOT" != "$VER" ]; then echo "Publikation liefert $GOT, gepinnt ist $VER" >&2; exit 1; fi
          mkdir -p "$DIR" && mv /tmp/pros/package "$DIR/package"
          echo "installiert: $PKG#$VER aus der Publikation"

      - name: Run SUSHI (triggers FHIR package download to ~/.fhir/packages)
        run: |
          sushi .

      - name: Render PROMIS translation tables into pagecontent
        # Reads PROMIS Questionnaires from the MII PRO-Modul package (downloaded above by SUSHI)
        # and injects DE/EN/Code/Ordinal tables between AUTO-TRANSLATION-TABLE markers in the
        # PROMIS-29.md, PROMIS-16.md and PROMIS-Cognitive-Function.md pagecontent files.
        # Idempotent: re-runs replace the section without touching surrounding content.
        run: python3 scripts/render-promis-translations.py

      - name: Build IG
        run: |
          chmod +x _build.sh
          ./_build.sh -y

      - name: Upload built IG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: output
          retention-days: 14

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ig-output
          path: output

      - name: Deploy main to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: true
          commit_message: "deploy(main): ${{ github.sha }}"

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ig-output
          path: output

      - name: Deploy PR preview to gh-pages /preview/pr-N
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          destination_dir: preview/pr-${{ github.event.pull_request.number }}
          keep_files: true
          commit_message: "deploy(pr-${{ github.event.pull_request.number }}): ${{ github.event.pull_request.head.sha }}"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            🚀 **PR Preview deployed**

            📖 Preview (DE): https://bih-cei.github.io/PCOR-MII/preview/pr-${{ github.event.pull_request.number }}/de/
            📖 Preview (EN): https://bih-cei.github.io/PCOR-MII/preview/pr-${{ github.event.pull_request.number }}/en/
            🌐 Sprach-Picker (Root, JS-Redirect): https://bih-cei.github.io/PCOR-MII/preview/pr-${{ github.event.pull_request.number }}/
            🕐 Commit `${{ github.event.pull_request.head.sha }}` · Run ${{ github.run_id }}

            *Wird beim Schließen des PRs automatisch entfernt.*
